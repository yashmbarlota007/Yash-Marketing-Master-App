<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Yash Marketing OS</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    /* ==========================================
       DESIGN SYSTEM VARIABLES
       ========================================== */
    :root {
      --primary: #0f172a; 
      --accent: #2563eb; 
      --accent-hover: #1d4ed8;
      --bg: #f8fafc; 
      --surface: #ffffff; 
      --text: #0f172a; 
      --text-muted: #64748b;
      --border: #e2e8f0; 
      --danger: #ef4444; 
      --success: #10b981;
    }
    
    * { 
      box-sizing: border-box; 
      font-family: 'Inter', sans-serif; 
      -webkit-tap-highlight-color: transparent; 
    }
    
    body, html { 
      height: 100%; 
      margin: 0; 
      background-color: var(--bg); 
      overflow: hidden; 
    }
    
    /* ==========================================
       LOGIN SCREEN UX
       ========================================== */
    .login-container { 
      display: flex; 
      justify-content: center; 
      align-items: center; 
      height: 100vh; 
      padding: 20px; 
      background: linear-gradient(135deg, #f8fafc 0%, #e2e8f0 100%); 
    }
    
    .login-card { 
      background: var(--surface); 
      padding: 40px 30px; 
      border-radius: 24px; 
      box-shadow: 0 20px 25px -5px rgba(0,0,0,0.05), 0 10px 10px -5px rgba(0,0,0,0.04); 
      width: 100%; 
      max-width: 380px; 
    }
    
    .login-card h2 { 
      margin: 0 0 5px 0; 
      color: var(--primary); 
      font-weight: 800; 
      font-size: 24px; 
      text-align: center; 
      letter-spacing: -0.5px; 
    }
    
    .login-card p { 
      margin: 0 0 30px 0; 
      color: var(--text-muted); 
      font-size: 14px; 
      text-align: center; 
    }
    
    .input-group { 
      margin-bottom: 20px; 
    }
    
    .input-group label { 
      display: block; 
      font-size: 12px; 
      font-weight: 600; 
      color: var(--text-muted); 
      text-transform: uppercase; 
      margin-bottom: 8px; 
      letter-spacing: 0.5px; 
    }
    
    .input-group input { 
      width: 100%; 
      padding: 14px 16px; 
      border: 2px solid var(--border); 
      border-radius: 12px; 
      font-size: 16px; 
      transition: all 0.2s; 
      background: #f8fafc; 
    }
    
    .input-group input:focus { 
      border-color: var(--accent); 
      background: var(--surface); 
      outline: none; 
      box-shadow: 0 0 0 4px rgba(37,99,235,0.1); 
    }
    
    .btn-login { 
      width: 100%; 
      padding: 16px; 
      background: var(--primary); 
      color: white; 
      border: none; 
      border-radius: 12px; 
      font-size: 16px; 
      font-weight: 700; 
      cursor: pointer; 
      transition: transform 0.1s, background 0.2s; 
    }
    
    .btn-login:active { 
      transform: scale(0.98); 
    }
    
    .error-msg { 
      color: var(--danger); 
      font-size: 13px; 
      font-weight: 600; 
      text-align: center; 
      margin-top: 15px; 
      display: none; 
    }

    /* ==========================================
       PORTAL UX
       ========================================== */
    .portal-container { 
      display: none; 
      height: 100dvh; 
      flex-direction: column; 
      background: var(--bg); 
      overflow: hidden; 
    }
    
    .app-header { 
      background: var(--surface); 
      padding: 15px 20px 10px 20px; 
      border-bottom: 1px solid var(--border); 
      z-index: 100; 
      box-shadow: 0 4px 6px -1px rgba(0,0,0,0.02); 
    }
    
    .header-top { 
      display: flex; 
      justify-content: space-between; 
      align-items: center; 
      margin-bottom: 15px; 
    }
    
    .user-profile { 
      display: flex; 
      align-items: center; 
      gap: 10px; 
    }
    
    .avatar { 
      width: 36px; 
      height: 36px; 
      background: var(--accent); 
      color: white; 
      border-radius: 50%; 
      display: flex; 
      justify-content: center; 
      align-items: center; 
      font-weight: 700; 
      font-size: 14px; 
    }
    
    .user-text { 
      display: flex; 
      flex-direction: column; 
    }
    
    .user-name { 
      font-weight: 700; 
      font-size: 15px; 
      color: var(--primary); 
      line-height: 1.2; 
    }
    
    .user-role { 
      font-size: 11px; 
      color: var(--text-muted); 
      font-weight: 600; 
      text-transform: uppercase; 
      letter-spacing: 0.5px; 
    }
    
    .btn-logout { 
      background: #fef2f2; 
      color: var(--danger); 
      border: none; 
      padding: 8px 14px; 
      border-radius: 8px; 
      font-size: 12px; 
      font-weight: 700; 
      cursor: pointer; 
    }

    /* ==========================================
       MODERN HORIZONTAL SCROLL NAV
       ========================================== */
    .nav-slider { 
      display: flex; 
      gap: 10px; 
      overflow-x: auto; 
      padding-bottom: 10px; 
      scroll-behavior: smooth; 
      -webkit-overflow-scrolling: touch; 
    }
    
    .nav-slider::-webkit-scrollbar { 
      display: none; 
    }
    
    .app-pill { 
      white-space: nowrap; 
      padding: 10px 18px; 
      background: var(--bg); 
      color: var(--text-muted); 
      border: 1px solid var(--border); 
      border-radius: 20px; 
      font-size: 13px; 
      font-weight: 600; 
      cursor: pointer; 
      transition: all 0.2s; 
    }
    
    .app-pill.active { 
      background: var(--primary); 
      color: white; 
      border-color: var(--primary); 
      box-shadow: 0 4px 6px -1px rgba(15,23,42,0.2); 
    }

    /* ==========================================
       BACKGROUND LOADING INDICATOR
       ========================================== */
    .status-bar { 
      font-size: 11px; 
      font-weight: 600; 
      color: var(--accent); 
      display: flex; 
      align-items: center; 
      gap: 6px; 
      padding-bottom: 5px; 
    }
    
    .spinner { 
      width: 12px; 
      height: 12px; 
      border: 2px solid rgba(37,99,235,0.3); 
      border-top-color: var(--accent); 
      border-radius: 50%; 
      animation: spin 1s linear infinite; 
    }
    
    @keyframes spin { 
      to { transform: rotate(360deg); } 
    }

    /* ==========================================
       IFRAME CONTAINER
       ========================================== */
    #iframesContainer { 
      flex: 1; 
      min-height: 0; 
      position: relative; 
      width: 100%; 
      background: var(--bg); 
    }
    
    .app-frame { 
      width: 100%; 
      height: 100%; 
      border: none; 
      background: white; 
      position: absolute; 
      top: 0; 
      left: 0; 
      opacity: 0; 
      pointer-events: none; 
      transition: opacity 0.3s ease; 
    }
    
    .app-frame.active { 
      opacity: 1; 
      pointer-events: auto; 
      z-index: 10; 
    }

    /* ==========================================
       TOAST NOTIFICATION SYSTEM
       ========================================== */
    #toastContainer { 
      position: fixed; 
      top: 20px; 
      left: 50%; 
      transform: translateX(-50%); 
      z-index: 9999; 
      display: flex; 
      flex-direction: column; 
      gap: 10px; 
      pointer-events: none; 
      width: 90%; 
      max-width: 400px; 
    }
    
    .toast { 
      background: var(--primary); 
      color: white; 
      padding: 14px 20px; 
      border-radius: 12px; 
      box-shadow: 0 15px 25px -5px rgba(0,0,0,0.2); 
      display: flex; 
      flex-direction: column; 
      animation: slideDown 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards; 
      pointer-events: auto; 
      border: 1px solid rgba(255,255,255,0.1); 
    }
    
    .toast-title { 
      font-size: 11px; 
      font-weight: 800; 
      color: var(--accent); 
      text-transform: uppercase; 
      letter-spacing: 1px; 
      margin-bottom: 4px; 
    }
    
    .toast-msg { 
      font-size: 13px; 
      font-weight: 500; 
      line-height: 1.4; 
    }
    
    @keyframes slideDown { 
      from { transform: translateY(-150%); opacity: 0; } 
      to { transform: translateY(0); opacity: 1; } 
    }
  </style>
</head>
<body>

  <!-- TOAST NOTIFICATION AREA -->
  <div id="toastContainer"></div>

  <!-- LOGIN SCREEN -->
  <div id="loginScreen" class="login-container">
    <div class="login-card">
      <h2>Yash Marketing</h2>
      <p>Unified Enterprise OS</p>
      <div class="input-group">
        <label>Employee ID</label>
        <input type="text" id="username" placeholder="e.g. YM001" autocomplete="off">
      </div>
      <div class="input-group">
        <label>Password</label>
        <input type="password" id="password" placeholder="Enter PIN">
      </div>
      <button id="loginBtn" class="btn-login" onclick="executeLogin()">Secure Login</button>
      <div id="loginError" class="error-msg"></div>
    </div>
  </div>

  <!-- MASTER PORTAL -->
  <div id="portalScreen" class="portal-container">
    <div class="app-header">
      <div class="header-top">
        <div class="user-profile">
          <div class="avatar" id="userInitial">Y</div>
          <div class="user-text">
            <span class="user-name" id="welcomeUser">Loading...</span>
            <span class="user-role" id="welcomeRole">Staff</span>
          </div>
        </div>
        <button onclick="logout()" class="btn-logout">Logout</button>
      </div>
      
      <div class="status-bar" id="loadingStatus">
        <div class="spinner"></div> <span id="loadingText">Booting sub-systems in background...</span>
      </div>

      <div class="nav-slider" id="appButtonsContainer"></div>
    </div>
    
    <div id="iframesContainer"></div>
  </div>

  <script>
    // ==========================================
    // 🔗 API CONNECTION (PASTE GAS WEB APP URL)
    // ==========================================
    const API_URL = "https://script.google.com/macros/s/AKfycbwZO9fZ5HT91iDruilFmavDYigdga0d6D88tXAyL0ySJMl01nu-zyneiHTq7MmrXZDG/exec";

    const appsConfig = [
      { name: "Tasks", url: "https://script.google.com/macros/s/AKfycbyKXM24nWJq6ejMdmLO7IGSp6VgtMBdX3nSXUoMh44cGzTaCwTQ87wzzYUffW0hJt7a/exec", roles: ["Owner", "Accountant", "Store Manager", "MIS" ,"CRM", "Sales Boy"] },
      { name: "Attendance", url: "https://script.google.com/macros/s/AKfycbxqR-0ALaYJJH8B5JjNd62sOtXEvMs6yL2QgFJbTRT2L8R-my0RC8WuYDUj3Z04NpXatg/exec", roles: ["Owner", "Accountant", "Store Manager", "MIS" ,"CRM", "Sales Boy"] },
      { name: "Orders", url: "https://yash-marketing-backend-app.vercel.app/", roles: ["Owner", "Accountant", "Store Manager", "MIS" ,"CRM"] },
      { name: "Replacemnts", url: "https://script.google.com/macros/s/AKfycbzAOHk0S_fwB_bBW43qqyBxBcvgMDsdL3MARTAVMNuHJVrYF44gWz13wCc1dR1aIdrq_g/exec", roles: ["Owner", "Accountant", "Store Manager", "MIS" ,"CRM"] },
      { name: "Dealer", url: "https://yash-marketing-app.vercel.app/", roles: ["Owner", "Accountant", "Store Manager", "MIS" ,"CRM", "Sales Boy"] },
      { name: "CRM", url: "https://script.google.com/macros/s/AKfycbx4XydiyPajkOrOJInNy3rCUM1TidmAHiwOq5NsZdtaQBzuYsn1VNswPf9Uzm3nfIIWiA/exec", roles: ["Owner", "MIS" ,"CRM"] },
      { name: "Market", url: "https://script.google.com/macros/s/AKfycbxEqsfxcoZR0lp6X4TFfmZNgTwV1NL1bU7T5nUzL6CeraBSWgtbdBAMXBtigRSDy4nj/exec", roles: ["Owner", "Sales Boy", "MIS", "Accountant"] },
      { name: "Audit OS", url: "https://yash-marketing-stock-audit.vercel.app/", roles: ["Owner", "Store Manager", "Sales Boy", "MIS", "CRM"] }
    ];

    let loggedInUser = { empId: "", role: "", pass: "" };

    // ==========================================
    // OPTIMISTIC UI: INSTANT LOAD CACHED USER
    // ==========================================
    window.onload = function() {
      const cachedId = localStorage.getItem('ym_master_id');
      const cachedRole = localStorage.getItem('ym_master_role');
      const cachedName = localStorage.getItem('ym_master_name');

      if (cachedId && cachedRole && cachedName) {
        // INSTANT BOOT - Zero server wait time for returning staff
        loggedInUser.empId = cachedId;
        loggedInUser.role = cachedRole;
        
        document.getElementById("welcomeUser").innerText = cachedName;
        document.getElementById("welcomeRole").innerText = cachedRole;
        document.getElementById("userInitial").innerText = cachedName.charAt(0).toUpperCase();
        
        buildPortalEngine(cachedRole);
      }
    };

    // ==========================================
    // CUSTOM NOTIFICATION SYSTEM
    // ==========================================
    function showNotification(title, message) {
      const container = document.getElementById("toastContainer");
      const toast = document.createElement("div");
      toast.className = "toast";
      toast.innerHTML = `
        <span class="toast-title">${title}</span>
        <span class="toast-msg">${message}</span>
      `;
      container.appendChild(toast);
      
      // Auto remove after 5 seconds
      setTimeout(() => {
        toast.style.opacity = '0';
        toast.style.transition = 'opacity 0.3s ease';
        setTimeout(() => toast.remove(), 300);
      }, 5000);
    }

    // ==========================================
    // SYSTEM PERMISSIONS INITIALIZER
    // ==========================================
    async function requestSystemPermissions() {
      // 1. Request GPS Location Permission
      if (navigator.geolocation) {
        navigator.geolocation.getCurrentPosition(
          (position) => { console.log("System Status: GPS Location access granted."); },
          (error) => {
            console.warn("System Status: GPS Location access denied.", error);
            showNotification("Permission Required", "⚠️ Please allow Location access in your browser settings for accurate tracking.");
          },
          { enableHighAccuracy: true, timeout: 10000, maximumAge: 0 }
        );
      } else {
        console.warn("Geolocation is not supported by this browser.");
      }

      // 2. Request Camera Permission
      try {
        if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
          // Request the rear camera
          const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } });
          // Immediately stop the tracks so the camera doesn't stay active in the background
          stream.getTracks().forEach(track => track.stop());
          console.log("System Status: Camera access granted.");
        }
      } catch (err) {
        console.warn("System Status: Camera access denied.", err);
        showNotification("Permission Required", "📸 Please allow Camera access in your browser settings to capture live proofs.");
      }
    }

    // ==========================================
    // AUTHENTICATION LOGIC
    // ==========================================
    async function executeLogin() {
      const id = document.getElementById("username").value.trim();
      const pass = document.getElementById("password").value.trim();
      const btn = document.getElementById("loginBtn");
      const errorBox = document.getElementById("loginError");
      
      if(!id || !pass) return;

      errorBox.style.display = "none";
      btn.innerText = "Authenticating...";
      btn.style.opacity = "0.7";
      
      try {
        const response = await fetch(API_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify({ action: "login", empId: id, password: pass })
        });
        const result = await response.json();

        if(result.success) {
          loggedInUser.empId = result.empId;
          loggedInUser.role = result.role;
          loggedInUser.pass = pass; 
          
          // CACHE EVERYTHING FOR INSTANT NEXT LOAD
          localStorage.setItem('ym_master_id', id);
          localStorage.setItem('ym_master_role', result.role);
          localStorage.setItem('ym_master_name', result.username);
          
          document.getElementById("welcomeUser").innerText = result.username;
          document.getElementById("welcomeRole").innerText = result.role;
          document.getElementById("userInitial").innerText = result.username.charAt(0).toUpperCase();
          
          buildPortalEngine(result.role);
        } else {
          errorBox.innerText = result.message;
          errorBox.style.display = "block";
          btn.innerText = "Secure Login";
          btn.style.opacity = "1";
        }
      } catch (e) {
        errorBox.innerText = "Network Error. Check connection.";
        errorBox.style.display = "block";
        btn.innerText = "Secure Login";
        btn.style.opacity = "1";
      }
    }

    // ==========================================
    // PORTAL & IFRAME ENGINE
    // ==========================================
    function buildPortalEngine(role) {
      document.getElementById("loginScreen").style.display = "none";
      document.getElementById("portalScreen").style.display = "flex";
      
      requestSystemPermissions();
      
      const btnContainer = document.getElementById("appButtonsContainer");
      const iframeContainer = document.getElementById("iframesContainer");
      
      btnContainer.innerHTML = ""; 
      iframeContainer.innerHTML = ""; 
      
      let isFirstApp = true;
      let allowedApps = appsConfig.filter(app => app.roles.includes(role));

      if(allowedApps.length === 0) {
        document.getElementById("loadingStatus").style.display = "none";
        alert("No applications assigned to your operational role.");
        return;
      }

      document.getElementById("loadingStatus").style.display = "none";
// Retrieve the last opened app index, default to 0
      let savedTabIndex = localStorage.getItem('ym_active_app') || 0;
      
      // Ensure the saved index doesn't exceed allowed apps
      if (savedTabIndex >= allowedApps.length) savedTabIndex = 0;

      allowedApps.forEach((app, index) => {
        let separator = app.url.includes("?") ? "&" : "?";
        let secureUrl = `${app.url}${separator}empId=${encodeURIComponent(loggedInUser.empId)}&role=${encodeURIComponent(loggedInUser.role)}`;
        
        // Determine if this specific app was the last one active
        let isActiveApp = (index == savedTabIndex);

        // Build Navigation Pill
        let btn = document.createElement("div");
        btn.className = "app-pill " + (isActiveApp ? "active" : "");
        btn.innerText = app.name;
        
        // Build Iframe
        let frame = document.createElement("iframe");
        frame.id = "frame_app_" + index;
        frame.className = "app-frame " + (isActiveApp ? "active" : "");
        frame.setAttribute("allow", "camera *; geolocation *; microphone *; clipboard-read; clipboard-write");
        
        // LAZY LOADING LOGIC
        frame.dataset.src = secureUrl; 
        
        if (isActiveApp) {
            frame.src = secureUrl; // Boot the active app immediately
        }
        
        iframeContainer.appendChild(frame);

        // Tab Switching & Lazy Load Trigger
        btn.onclick = function() {
          // SAVE STATE: Remember this tab for future refreshes
          localStorage.setItem('ym_active_app', index);

          // Update active states
          document.querySelectorAll(".app-pill").forEach(b => b.classList.remove("active"));
          btn.classList.add("active");
          
          document.querySelectorAll(".app-frame").forEach(f => f.classList.remove("active"));
          let targetFrame = document.getElementById("frame_app_" + index);
          targetFrame.classList.add("active");
          
          // If the app hasn't been loaded yet, load it now
          if (!targetFrame.src) {
              targetFrame.src = targetFrame.dataset.src;
              showNotification("Loading", "Starting " + app.name + "...");
          }
          
          btn.scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'center' });
        };
        
        btnContainer.appendChild(btn);
      });

      // ==========================================
      // GHOST PRE-FETCHING
      // ==========================================
      // Wait 4 seconds for the main app to load, then silently download the rest in the background.
      setTimeout(() => {
        document.querySelectorAll(".app-frame").forEach(frame => {
          if (!frame.src && frame.dataset.src) {
            frame.src = frame.dataset.src;
            console.log("Silently pre-loaded: " + frame.dataset.src);
          }
        });
      }, 4000); 
    }

    // ==========================================
    // LOGOUT LOGIC
    // ==========================================
    function logout() {
      // Clear all cached credentials on logout
      localStorage.removeItem('ym_master_id');
      localStorage.removeItem('ym_master_pass');
      localStorage.removeItem('ym_master_role');
      localStorage.removeItem('ym_master_name');
      location.reload();
    }
  </script>
</body>
</html>
